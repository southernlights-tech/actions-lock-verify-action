name: Actions Lockfile Verify
description: >-
  Installs the pinned github/gh-actions-lock extension and verifies that the
  given onboarded workflow paths are locked and current. A lockfile change
  decides which commit executes, so keep this gate required on pull requests
  that touch .github/workflows/**.
author: southernlights.tech

inputs:
  workflows:
    description: "Space-separated list of workflow paths to verify, e.g. '.github/workflows/release.yml .github/workflows/build.yml'."
    required: true
  extension-pin:
    description: "Pinned version of github/gh-actions-lock."
    required: false
    default: "v0.2.0"
  token:
    description: "Token used by the gh CLI. Defaults to the workflow's GITHUB_TOKEN."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify actions lockfile
      shell: bash
      env:
        WORKFLOWS: ${{ inputs.workflows }}
        EXTENSION_PIN: ${{ inputs.extension-pin }}
        GH_TOKEN: ${{ inputs.token || github.token }}
      run: bash "${{ github.action_path }}/scripts/verify-actions-lock.sh"
