name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable scripts/verify-actions-lock.sh scripts/gate-coverage.sh

      - name: Bats
        run: docker run --rm -v "$PWD":/code -w /code bats/bats:latest tests/
